<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 440" width="900" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">Metadata-driven data pipeline</title>
  <desc id="d">A metadata store feeds configuration to every pipeline stage: sources, ingest, validate, transform and serve. Data records flow left to right along the data lane.</desc>

  <style>
    :root {
      --box: #f7f8f6; --stroke: #cfd6d2; --text: #1c2b2a; --muted: #5b6b69;
      --meta: #b45f06; --meta-bg: #fdf3e3; --data: #0f766e;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --box: #141d1c; --stroke: #2b3a38; --text: #e4ecea; --muted: #93a5a2;
        --meta: #f2a541; --meta-bg: #2a2114; --data: #3ccdb8;
      }
    }
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: var(--text); }
    .title { font-size: 15px; font-weight: 600; }
    .muted { font-size: 12px; fill: var(--muted); }
    .plane { font-size: 13px; font-weight: 600; fill: var(--meta); }
    .lane  { font-size: 13px; font-weight: 600; fill: var(--data); }
    .key   { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; fill: var(--meta); }

    .store { fill: var(--meta-bg); stroke: var(--meta); stroke-width: 1.5; stroke-dasharray: 7 5; }
    .chip  { fill: var(--box); stroke: var(--meta); stroke-width: 1.3; animation: glow 7.5s ease-in-out infinite; }
    .box   { fill: var(--box); stroke: var(--stroke); stroke-width: 1.5; }
    .pull  { stroke: var(--meta); stroke-width: 1.5; stroke-dasharray: 4 5; fill: none; animation: dash 1.1s linear infinite; }
    .pipe  { stroke: var(--data); stroke-width: 1.8; fill: none; }
    .rail  { stroke: var(--data); stroke-width: 1.5; stroke-dasharray: 3 6; fill: none; opacity: .55; }
    .call  { fill: none; stroke: var(--meta); stroke-width: 1.3; }

    .c1 { animation-delay: 0s; } .c2 { animation-delay: 1.5s; } .c3 { animation-delay: 3s; }
    .c4 { animation-delay: 4.5s; } .c5 { animation-delay: 6s; }

    @keyframes dash { to { stroke-dashoffset: -9; } }
    @keyframes glow {
      0%   { opacity: .5; }
      6%   { opacity: 1; }
      18%  { opacity: 1; }
      26%  { opacity: .5; }
      100% { opacity: .5; }
    }
    @media (prefers-reduced-motion: reduce) { .chip, .pull { animation: none; } .chip { opacity: 1; } }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" style="stroke: var(--data)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <!-- one shimmer band that sweeps across every stage, left to right -->
    <linearGradient id="sweep" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="900" y2="0">
      <stop offset="0.43" style="stop-color: var(--data); stop-opacity: 0"/>
      <stop offset="0.5"  style="stop-color: var(--data); stop-opacity: 0.2"/>
      <stop offset="0.57" style="stop-color: var(--data); stop-opacity: 0"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        values="-520 0; 520 0; 520 0" keyTimes="0; 0.7; 1" dur="5s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <!-- Control plane: metadata store -->
  <rect class="store" x="10" y="14" width="880" height="104" rx="12"/>
  <text class="plane" x="28" y="34">Metadata store</text>
  <text class="muted" x="450" y="106" text-anchor="middle">One row per dataset. The code stays the same, the metadata changes.</text>

  <g>
    <rect class="chip c1" x="20"  y="46" width="140" height="32" rx="16"/>
    <rect class="chip c2" x="200" y="46" width="140" height="32" rx="16"/>
    <rect class="chip c3" x="380" y="46" width="140" height="32" rx="16"/>
    <rect class="chip c4" x="560" y="46" width="140" height="32" rx="16"/>
    <rect class="chip c5" x="740" y="46" width="140" height="32" rx="16"/>
    <text class="key" x="90"  y="66" text-anchor="middle">connections</text>
    <text class="key" x="270" y="66" text-anchor="middle">source_config</text>
    <text class="key" x="450" y="66" text-anchor="middle">dq_rules</text>
    <text class="key" x="630" y="66" text-anchor="middle">mappings</text>
    <text class="key" x="810" y="66" text-anchor="middle">target_config</text>
  </g>

  <!-- Metadata being pulled by each stage -->
  <g>
    <path class="pull" d="M90 118 V198"/>
    <path class="pull" d="M270 118 V198"/>
    <path class="pull" d="M450 118 V198"/>
    <path class="pull" d="M630 118 V198"/>
    <path class="pull" d="M810 118 V198"/>

    <circle r="4" fill="var(--meta)"><animateMotion dur="2.4s" begin="0s"    repeatCount="indefinite" path="M90 118 V198"/></circle>
    <circle r="4" fill="var(--meta)"><animateMotion dur="2.4s" begin="0.5s"  repeatCount="indefinite" path="M270 118 V198"/></circle>
    <circle r="4" fill="var(--meta)"><animateMotion dur="2.4s" begin="1s"    repeatCount="indefinite" path="M450 118 V198"/></circle>
    <circle r="4" fill="var(--meta)"><animateMotion dur="2.4s" begin="1.5s"  repeatCount="indefinite" path="M630 118 V198"/></circle>
    <circle r="4" fill="var(--meta)"><animateMotion dur="2.4s" begin="2s"    repeatCount="indefinite" path="M810 118 V198"/></circle>
  </g>

  <!-- Pipeline stages -->
  <g>
    <rect class="box" x="20"  y="200" width="140" height="90" rx="10"/>
    <rect class="box" x="200" y="200" width="140" height="90" rx="10"/>
    <rect class="box" x="380" y="200" width="140" height="90" rx="10"/>
    <rect class="box" x="560" y="200" width="140" height="90" rx="10"/>
    <rect class="box" x="740" y="200" width="140" height="90" rx="10"/>

    <!-- skeleton shimmer overlay -->
    <rect fill="url(#sweep)" x="20"  y="200" width="140" height="90" rx="10"/>
    <rect fill="url(#sweep)" x="200" y="200" width="140" height="90" rx="10"/>
    <rect fill="url(#sweep)" x="380" y="200" width="140" height="90" rx="10"/>
    <rect fill="url(#sweep)" x="560" y="200" width="140" height="90" rx="10"/>
    <rect fill="url(#sweep)" x="740" y="200" width="140" height="90" rx="10"/>

    <text class="title" x="90"  y="238" text-anchor="middle">Sources</text>
    <text class="title" x="270" y="238" text-anchor="middle">Ingest</text>
    <text class="title" x="450" y="238" text-anchor="middle">Validate</text>
    <text class="title" x="630" y="238" text-anchor="middle">Transform</text>
    <text class="title" x="810" y="238" text-anchor="middle">Serve</text>

    <text class="muted" x="90"  y="262" text-anchor="middle">DB, API, files</text>
    <text class="muted" x="270" y="262" text-anchor="middle">land raw data</text>
    <text class="muted" x="450" y="262" text-anchor="middle">check quality</text>
    <text class="muted" x="630" y="262" text-anchor="middle">apply logic</text>
    <text class="muted" x="810" y="262" text-anchor="middle">publish tables</text>
  </g>

  <!-- Hand-offs between stages -->
  <g class="pipe">
    <path d="M164 245 H194" marker-end="url(#arrow)"/>
    <path d="M344 245 H374" marker-end="url(#arrow)"/>
    <path d="M524 245 H554" marker-end="url(#arrow)"/>
    <path d="M704 245 H734" marker-end="url(#arrow)"/>
  </g>

  <!-- Data lane -->
  <g>
    <path class="rail" d="M90 330 H810"/>
    <path class="rail" d="M90 290 V330 M270 290 V330 M450 290 V330 M630 290 V330 M810 290 V330"/>
    <circle cx="90"  cy="330" r="4" fill="var(--data)"/>
    <circle cx="270" cy="330" r="4" fill="var(--data)"/>
    <circle cx="450" cy="330" r="4" fill="var(--data)"/>
    <circle cx="630" cy="330" r="4" fill="var(--data)"/>
    <circle cx="810" cy="330" r="4" fill="var(--data)"/>

    <g fill="var(--data)">
      <rect x="-6" y="-6" width="12" height="12" rx="3">
        <animateMotion dur="6s" begin="0s"  repeatCount="indefinite" path="M90 330 H810"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="6s" begin="0s" repeatCount="indefinite"/>
      </rect>
      <rect x="-6" y="-6" width="12" height="12" rx="3">
        <animateMotion dur="6s" begin="-2s" repeatCount="indefinite" path="M90 330 H810"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="6s" begin="-2s" repeatCount="indefinite"/>
      </rect>
      <rect x="-6" y="-6" width="12" height="12" rx="3">
        <animateMotion dur="6s" begin="-4s" repeatCount="indefinite" path="M90 330 H810"/>
        <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.06;0.94;1" dur="6s" begin="-4s" repeatCount="indefinite"/>
      </rect>
    </g>
    <text class="lane" x="450" y="358" text-anchor="middle">Data lane</text>
    <text class="muted" x="450" y="376" text-anchor="middle">Records move left to right, shaped at each stage by the metadata above.</text>
  </g>

  <!-- Callout -->
  <rect class="call" x="170" y="392" width="560" height="34" rx="17"/>
  <circle cx="196" cy="409" r="5" fill="var(--meta)">
    <animate attributeName="r" values="4;7;4" dur="1.8s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0.35;1" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text class="muted" x="214" y="413" style="font-size: 13px; fill: var(--text)">New dataset? Add a row to the metadata store. No code change, no redeploy.</text>
</svg>
